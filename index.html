<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dictado PWA: Tito y su Moto</title>
    
    <!-- Configuración PWA / Mobile Web App -->
    <meta name="theme-color" content="#3b82f6">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dictado Tito">

    <!-- Framework Tailwind CSS & Fuentes/Iconos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');
        
        * {
            touch-action: manipulation;
        }

        body {
            font-family: 'Fredoka', cursive, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
            background: linear-gradient(135deg, #60a5fa 0%, #a7f3d0 50%, #fef08a 100%);
            background-attachment: fixed;
        }

        /* Fondo Animado Divertido para Niños */
        .kids-bg-decor {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        /* Nubes, Burbujas y Estrellas flotantes */
        .floating-item {
            position: absolute;
            opacity: 0.75;
            animation: floatAround linear infinite;
        }

        @keyframes floatAround {
            0% {
                transform: translateY(105vh) rotate(0deg) scale(0.9);
            }
            50% {
                transform: translateY(50vh) rotate(180deg) scale(1.1);
            }
            100% {
                transform: translateY(-15vh) rotate(360deg) scale(0.9);
            }
        }

        .syllable-card {
            touch-action: none;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .syllable-card:active {
            transform: scale(1.15) rotate(-3deg);
            z-index: 50;
        }

        .drop-target {
            min-width: 3.4rem;
            height: 3.8rem;
            border-bottom: 4px dashed #1d4ed8;
            transition: all 0.25s ease;
        }

        .drop-target.active-target {
            border-bottom-style: solid;
            border-bottom-color: #0284c7;
            background-color: rgba(255, 255, 255, 0.85);
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(14, 165, 233, 0.3);
        }

        .drop-target.correct {
            border-bottom-style: solid;
            border-bottom-color: #10b981;
            background-color: rgba(209, 250, 229, 0.95);
            color: #065f46;
        }

        .punctuation-mark {
            font-size: 1.1em;
            color: #0f172a;
            font-weight: 700;
        }

        @keyframes pulse-bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-4px) scale(1.04); }
        }

        .animate-pulse-bounce {
            animation: pulse-bounce 2s infinite ease-in-out;
        }

        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 9999px;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between p-2 sm:p-4 md:p-6 text-slate-800 relative">

    <div class="kids-bg-decor">
        <!-- Elementos decorativos animados flotantes -->
        <div class="floating-item text-white text-5xl" style="left: 5%; animation-duration: 18s; animation-delay: 0s;"><i class="fa-solid fa-cloud"></i></div>
        <div class="floating-item text-yellow-300 text-4xl" style="left: 18%; animation-duration: 14s; animation-delay: 2s;"><i class="fa-solid fa-star"></i></div>
        <div class="floating-item text-pink-300 text-3xl" style="left: 32%; animation-duration: 16s; animation-delay: 5s;"><i class="fa-solid fa-circle"></i></div>
        <div class="floating-item text-white text-6xl" style="left: 50%; animation-duration: 22s; animation-delay: 1s;"><i class="fa-solid fa-cloud"></i></div>
        <div class="floating-item text-yellow-400 text-5xl" style="left: 68%; animation-duration: 15s; animation-delay: 4s;"><i class="fa-solid fa-star"></i></div>
        <div class="floating-item text-blue-300 text-4xl" style="left: 82%; animation-duration: 19s; animation-delay: 3s;"><i class="fa-solid fa-cloud"></i></div>
        <div class="floating-item text-orange-400 text-4xl" style="left: 92%; animation-duration: 13s; animation-delay: 6s;"><i class="fa-solid fa-shapes"></i></div>
    </div>

    <header class="relative z-10 max-w-5xl w-full mx-auto bg-white/50 backdrop-blur-md rounded-3xl p-3 md:p-4 shadow-xl mb-3 flex flex-wrap justify-between items-center gap-3 border-2 border-white/60">
        <div class="flex items-center gap-3">
            <div class="bg-gradient-to-tr from-blue-500 via-indigo-500 to-purple-500 text-white p-3.5 rounded-2xl shadow-lg transform -rotate-3 hover:rotate-0 transition-all">
                <i class="fa-solid fa-motorcycle text-2xl md:text-3xl animate-bounce"></i>
            </div>
            <div>
                <h1 class="text-xl md:text-2xl font-black text-blue-950 tracking-wide leading-tight">TITO Y SU MOTO 🏍️</h1>
                <p class="text-xs md:text-sm text-blue-900 font-bold">¡Aprendemos la letra T jugando!</p>
            </div>
        </div>

        <div class="flex items-center gap-2 md:gap-4">
            <div class="flex items-center gap-2 bg-emerald-100/80 backdrop-blur-sm border-2 border-emerald-400/80 px-3 py-1.5 rounded-2xl shadow-sm">
                <i class="fa-solid fa-face-laugh-beam text-emerald-600 text-2xl"></i>
                <div class="text-left">
                    <span class="block text-[10px] text-emerald-900 font-bold uppercase tracking-wider">Aciertos</span>
                    <span id="score-hits" class="text-base md:text-lg font-black text-emerald-800">0</span>
                </div>
            </div>

            <div class="flex items-center gap-2 bg-rose-100/80 backdrop-blur-sm border-2 border-rose-400/80 px-3 py-1.5 rounded-2xl shadow-sm">
                <i class="fa-solid fa-face-frown text-rose-600 text-2xl"></i>
                <div class="text-left">
                    <span class="block text-[10px] text-rose-900 font-bold uppercase tracking-wider">Fallas</span>
                    <span id="score-fails" class="text-base md:text-lg font-black text-rose-800">0 / 15</span>
                </div>
            </div>

            <button id="btn-install-pwa" class="hidden bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 active:scale-95 text-white px-3.5 py-2 rounded-2xl shadow-lg transition-all flex items-center gap-2 text-xs font-black cursor-pointer border-2 border-white" title="Instalar App">
                <i class="fa-solid fa-download text-base"></i>
                <span class="hidden sm:inline">Instalar App</span>
            </button>
        </div>
    </header>

    <main class="relative z-10 max-w-5xl w-full mx-auto flex-1 flex flex-col gap-4">
        <!-- Contenedor Pizarrón Transparente (bg-white/40) para lucir el fondo colorido -->
        <div class="bg-white/40 backdrop-blur-md rounded-3xl p-4 md:p-8 shadow-2xl border-2 border-white/60 flex-1 flex flex-col justify-between relative overflow-hidden">
            <div class="flex flex-wrap justify-between items-center mb-4 pb-3 border-b-2 border-white/40 gap-2">
                <div class="flex items-center gap-2">
                    <span class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white text-xs font-black px-3.5 py-1.5 rounded-full uppercase tracking-wider shadow-md">
                        Oración <span id="current-sentence-num">1</span> / 7
                    </span>
                    <span class="bg-amber-100/90 border border-amber-300 text-amber-950 text-xs font-black px-3.5 py-1.5 rounded-full shadow-sm">
                        Palabra <span id="current-word-num">1</span>
                    </span>
                </div>

                <button id="btn-repeat-word" class="bg-gradient-to-r from-amber-400 via-orange-500 to-amber-500 hover:from-amber-500 hover:to-orange-600 text-white font-black py-2.5 px-5 rounded-2xl shadow-lg hover:shadow-xl active:scale-95 transition-all flex items-center gap-2 text-base md:text-lg animate-pulse-bounce border-2 border-white cursor-pointer">
                    <i class="fa-solid fa-volume-high text-xl"></i>
                    <span>Repetir Palabra</span>
                </button>
            </div>

            <div class="my-auto py-6 flex flex-col items-center justify-center min-h-[180px]">
                <div id="sentence-container" class="flex flex-wrap justify-center items-center gap-x-4 gap-y-6 text-2xl md:text-4xl font-bold text-slate-900 tracking-wide text-center">
                </div>
            </div>

            <div id="feedback-banner" class="text-center py-3 px-4 rounded-2xl font-black text-base md:text-lg bg-white/70 backdrop-blur-sm text-blue-950 border-2 border-blue-200/80 shadow-sm transition-all min-h-[52px] flex items-center justify-center">
                Escucha atentamente y arrastra o toca la sílaba o letra correspondiente.
            </div>
        </div>

        <div class="bg-white/50 backdrop-blur-md rounded-3xl p-4 shadow-xl border-2 border-white/60">
            <h2 class="text-center font-black text-blue-950 mb-3 text-sm md:text-base flex items-center justify-center gap-2">
                <i class="fa-solid fa-hand-pointer text-amber-500 text-xl animate-bounce"></i>
                Arrastra o toca la sílaba correcta:
            </h2>
            <div id="syllables-bank" class="flex flex-wrap justify-center gap-2.5 md:gap-3.5 max-w-4xl mx-auto custom-scrollbar">
            </div>
        </div>
    </main>

    <div id="modal-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white/95 rounded-3xl p-6 md:p-8 max-w-md w-full text-center shadow-2xl border-4 border-amber-400 relative transform transition-all scale-100">
            <div id="modal-icon" class="w-20 h-20 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl text-amber-500 shadow-inner">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 id="modal-title" class="text-2xl font-black text-slate-800 mb-2">¡Atención!</h3>
            <p id="modal-message" class="text-slate-600 mb-6 text-lg font-bold">Te quedan 3 intentos.</p>
            <button id="modal-btn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-black py-3.5 px-6 rounded-2xl shadow-lg transition-all text-lg active:scale-95 cursor-pointer border-2 border-white">
                Entendido
            </button>
        </div>
    </div>

    <script>
        // Configuración de manifest embebido dinámicamente
        const manifestJson = {
            "name": "Dictado Interactivo: Tito y su Moto",
            "short_name": "Dictado Tito",
            "start_url": "./",
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#3b82f6",
            "description": "App educativa interactiva para dictado y lectura de la lección Tito y su Moto.",
            "icons": [
                {
                    "src": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%233b82f6'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='white'>🏍️</text></svg>",
                    "sizes": "192x192 512x512",
                    "type": "image/svg+xml"
                }
            ]
        };

        const manifestBlob = new Blob([JSON.stringify(manifestJson)], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(manifestBlob);
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = manifestURL;
        document.head.appendChild(manifestLink);

        // Registro de Service Worker embebido mediante Blob
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'dictado-tito-v3';
                self.addEventListener('install', (e) => {
                    self.skipWaiting();
                });
                self.addEventListener('activate', (e) => {
                    self.clients.claim();
                });
                self.addEventListener('fetch', (e) => {
                    e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
                });
            `;
            const swBlob = new Blob([swCode], {type: 'application/javascript'});
            const swUrl = URL.createObjectURL(swBlob);
            navigator.serviceWorker.register(swUrl).catch(() => {});
        }

        // PWA Install Prompt Handler
        let deferredPrompt;
        const btnInstallPwa = document.getElementById('btn-install-pwa');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            btnInstallPwa.classList.remove('hidden');
        });

        btnInstallPwa.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    btnInstallPwa.classList.add('hidden');
                }
                deferredPrompt = null;
            }
        });

        // ESTRUCTURA DE LA LECCIÓN "TITO"
        const LESSON_DATA = [
            {
                fullSentence: "TITO.",
                words: [
                    { full: "TITO.", targetSyllable: "TI", staticText: "TO.", pos: "prefix", punct: "" }
                ]
            },
            {
                fullSentence: "TITO USA MOTO.",
                words: [
                    { full: "TITO", targetSyllable: "TI", staticText: "TO", pos: "prefix", punct: "" },
                    { full: "USA", targetSyllable: "U", staticText: "SA", pos: "prefix", punct: "" },
                    { full: "MOTO.", targetSyllable: "MO", staticText: "TO.", pos: "prefix", punct: "" }
                ]
            },
            {
                fullSentence: "SU TÍO TOMÁS USA MOTO.",
                words: [
                    { full: "SU", targetSyllable: "SU", staticText: "", pos: "full", punct: "" },
                    { full: "TÍO", targetSyllable: "TÍ", staticText: "O", pos: "prefix", punct: "" },
                    { full: "TOMÁS", targetSyllable: "TO", staticText: "MÁS", pos: "prefix", punct: "" },
                    { full: "USA", targetSyllable: "U", staticText: "SA", pos: "prefix", punct: "" },
                    { full: "MOTO.", targetSyllable: "MO", staticText: "TO.", pos: "prefix", punct: "" }
                ]
            },
            {
                fullSentence: "TITO METE SU MOTO.",
                words: [
                    { full: "TITO", targetSyllable: "TI", staticText: "TO", pos: "prefix", punct: "" },
                    { full: "METE", targetSyllable: "ME", staticText: "TE", pos: "prefix", punct: "" },
                    { full: "SU", targetSyllable: "SU", staticText: "", pos: "full", punct: "" },
                    { full: "MOTO.", targetSyllable: "MO", staticText: "TO.", pos: "prefix", punct: "" }
                ]
            },
            {
                fullSentence: "SU TÍA EMA SE ASUSTA.",
                words: [
                    { full: "SU", targetSyllable: "SU", staticText: "", pos: "full", punct: "" },
                    { full: "TÍA", targetSyllable: "TÍA", staticText: "", pos: "full", punct: "" },
                    { full: "EMA", targetSyllable: "E", staticText: "MA", pos: "prefix", punct: "" },
                    { full: "SE", targetSyllable: "SE", staticText: "", pos: "full", punct: "" },
                    { full: "ASUSTA.", targetSyllable: "A", staticText: "SUSTA.", pos: "prefix", punct: "" }
                ]
            },
            {
                fullSentence: "TITO TOMA ESE TOMATE.",
                words: [
                    { full: "TITO", targetSyllable: "TI", staticText: "TO", pos: "prefix", punct: "" },
                    { full: "TOMA", targetSyllable: "TO", staticText: "MA", pos: "prefix", punct: "" },
                    { full: "ESE", targetSyllable: "E", staticText: "SE", pos: "prefix", punct: "" },
                    { full: "TOMATE.", targetSyllable: "TO", staticText: "MATE.", pos: "prefix", punct: "" }
                ]
            },
            {
                fullSentence: "SU TÍA TOMA TÉ.",
                words: [
                    { full: "SU", targetSyllable: "SU", staticText: "", pos: "full", punct: "" },
                    { full: "TÍA", targetSyllable: "TÍA", staticText: "", pos: "full", punct: "" },
                    { full: "TOMA", targetSyllable: "TO", staticText: "MA", pos: "prefix", punct: "" },
                    { full: "TÉ.", targetSyllable: "TÉ", staticText: ".", pos: "prefix", punct: "" }
                ]
            }
        ];

        // BANCO DE SÍLABAS
        const BASE_SYLLABLES = [
            "TA", "TE", "TI", "TO", "TU", "TÍ", "TÉ", "TÍA",
            "MA", "ME", "MI", "MO", "MU",
            "SA", "SE", "SI", "SO", "SU",
            "A", "E", "I", "O", "U"
        ];

        let currentSentenceIdx = 0;
        let currentWordIdx = 0;
        let hits = 0;
        let fails = 0;
        let selectedSyllable = null;
        let selectedVoice = null;

        const sentenceContainer = document.getElementById('sentence-container');
        const syllablesBank = document.getElementById('syllables-bank');
        const scoreHitsEl = document.getElementById('score-hits');
        const scoreFailsEl = document.getElementById('score-fails');
        const currentSentenceNumEl = document.getElementById('current-sentence-num');
        const currentWordNumEl = document.getElementById('current-word-num');
        const feedbackBanner = document.getElementById('feedback-banner');
        const btnRepeatWord = document.getElementById('btn-repeat-word');

        const modalOverlay = document.getElementById('modal-overlay');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalBtn = document.getElementById('modal-btn');

        function initSpeech() {
            if ('speechSynthesis' in window) {
                const loadVoices = () => {
                    const voices = window.speechSynthesis.getVoices();
                    selectedVoice = voices.find(v => v.lang.includes('es-MX') || v.lang.includes('es-US') || v.lang.includes('es-419')) 
                                 || voices.find(v => v.lang.startsWith('es')) 
                                 || null;
                };
                loadVoices();
                if (speechSynthesis.onvoiceschanged !== undefined) {
                    speechSynthesis.onvoiceschanged = loadVoices;
                }
            }
        }

        // Limpia el texto para ser leído limpiamente por el sintetizador de voz sin palabras extrañas
        function speak(text, callback = null, rate = 0.62) {
            if (!('speechSynthesis' in window)) {
                if (callback) callback();
                return;
            }

            window.speechSynthesis.cancel();
            
            // Filtrar cualquier emoji o símbolo decorativo para evitar lecturas indeseadas de voz
            const cleanText = text.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '').trim();

            const utterance = new SpeechSynthesisUtterance(cleanText);
            if (selectedVoice) utterance.voice = selectedVoice;
            utterance.lang = 'es-MX';
            utterance.rate = rate;
            utterance.pitch = 1.05;

            if (callback) {
                utterance.onend = callback;
            }

            window.speechSynthesis.speak(utterance);
        }

        function initGame() {
            currentSentenceIdx = 0;
            currentWordIdx = 0;
            hits = 0;
            fails = 0;
            updateScores();
            renderSentence();
            renderSyllablesBank();
            initSpeech();

            setTimeout(() => {
                dictateCurrentWord();
            }, 700);
        }

        function updateScores() {
            scoreHitsEl.textContent = hits;
            scoreFailsEl.textContent = `${fails} / 15`;
        }

        function dictateCurrentWord() {
            const currentSentence = LESSON_DATA[currentSentenceIdx];
            const currentWordObj = currentSentence.words[currentWordIdx];
            const cleanWord = currentWordObj.full.replace(/[,.]/g, '');
            speak(cleanWord, null, 0.62);
            feedbackBanner.textContent = `Escucha la palabra: "${cleanWord}"`;
        }

        function renderSentence() {
            const sentenceData = LESSON_DATA[currentSentenceIdx];
            sentenceContainer.innerHTML = '';

            currentSentenceNumEl.textContent = currentSentenceIdx + 1;
            currentWordNumEl.textContent = `${currentWordIdx + 1} de ${sentenceData.words.length}`;

            sentenceData.words.forEach((wordObj, wIdx) => {
                const wordWrapper = document.createElement('div');
                wordWrapper.className = 'inline-flex items-center gap-0.5 mx-1 my-1 p-2 rounded-2xl transition-all';

                const isCurrentWord = wIdx === currentWordIdx;
                const isCompletedWord = wIdx < currentWordIdx;

                if (isCurrentWord) {
                    wordWrapper.classList.add('bg-white/80', 'ring-4', 'ring-blue-400', 'shadow-md');
                }

                if (isCompletedWord) {
                    wordWrapper.innerHTML = `<span class="text-blue-950 font-black">${wordObj.full}</span>`;
                } else if (isCurrentWord) {
                    if (wordObj.pos === 'full') {
                        wordWrapper.appendChild(createDropTarget(wordObj.targetSyllable, wordObj.punct));
                    } else if (wordObj.pos === 'prefix') {
                        wordWrapper.appendChild(createDropTarget(wordObj.targetSyllable, wordObj.punct));
                        if (wordObj.staticText) {
                            const staticSpan = document.createElement('span');
                            staticSpan.className = 'font-black text-blue-950 tracking-normal';
                            staticSpan.textContent = wordObj.staticText;
                            wordWrapper.appendChild(staticSpan);
                        }
                    } else if (wordObj.pos === 'suffix') {
                        if (wordObj.staticText) {
                            const staticSpan = document.createElement('span');
                            staticSpan.className = 'font-black text-blue-950 tracking-normal';
                            staticSpan.textContent = wordObj.staticText;
                            wordWrapper.appendChild(staticSpan);
                        }
                        wordWrapper.appendChild(createDropTarget(wordObj.targetSyllable, wordObj.punct));
                    }
                } else {
                    const placeholder = document.createElement('span');
                    placeholder.className = 'text-slate-500 font-mono font-black tracking-widest opacity-60';
                    placeholder.textContent = '_'.repeat(wordObj.full.replace(/[,.]/g, '').length);
                    wordWrapper.appendChild(placeholder);
                }

                sentenceContainer.appendChild(wordWrapper);
            });
        }

        function createDropTarget(expectedSyllable, automaticPunctuation = "") {
            const dropContainer = document.createElement('div');
            dropContainer.className = 'inline-flex items-center';

            const dropEl = document.createElement('div');
            dropEl.className = 'drop-target active-target inline-flex items-center justify-center font-black px-2.5 mx-0.5 rounded-xl text-blue-950 cursor-pointer';
            dropEl.dataset.expected = expectedSyllable;

            dropEl.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropEl.classList.add('bg-sky-200');
            });

            dropEl.addEventListener('dragleave', () => {
                dropEl.classList.remove('bg-sky-200');
            });

            dropEl.addEventListener('drop', (e) => {
                e.preventDefault();
                dropEl.classList.remove('bg-sky-200');
                const droppedSyllable = e.dataTransfer.getData('text/plain');
                verifyAnswer(droppedSyllable, dropEl);
            });

            dropEl.addEventListener('click', () => {
                if (selectedSyllable) {
                    verifyAnswer(selectedSyllable, dropEl);
                    clearSelection();
                } else {
                    feedbackBanner.textContent = "Primero toca o arrastra una sílaba de la barra inferior.";
                }
            });

            dropContainer.appendChild(dropEl);

            if (automaticPunctuation) {
                const punctSpan = document.createElement('span');
                punctSpan.className = 'punctuation-mark';
                punctSpan.textContent = automaticPunctuation;
                dropContainer.appendChild(punctSpan);
            }

            return dropContainer;
        }

        function renderSyllablesBank() {
            syllablesBank.innerHTML = '';
            
            const currentWordObj = LESSON_DATA[currentSentenceIdx].words[currentWordIdx];
            const correctTarget = currentWordObj.targetSyllable;

            let options = new Set([correctTarget]);
            while (options.size < Math.min(8, BASE_SYLLABLES.length)) {
                const randomItem = BASE_SYLLABLES[Math.floor(Math.random() * BASE_SYLLABLES.length)];
                options.add(randomItem);
            }

            const colors = [
                'bg-gradient-to-b from-amber-400 to-orange-500 border-orange-600',
                'bg-gradient-to-b from-blue-400 to-indigo-500 border-indigo-600',
                'bg-gradient-to-b from-emerald-400 to-teal-500 border-teal-600',
                'bg-gradient-to-b from-pink-400 to-rose-500 border-rose-600',
                'bg-gradient-to-b from-purple-400 to-indigo-600 border-indigo-700'
            ];

            const optionsArray = Array.from(options).sort(() => Math.random() - 0.5);

            optionsArray.forEach((syllable, idx) => {
                const card = document.createElement('button');
                const colorClass = colors[idx % colors.length];
                card.className = `syllable-card ${colorClass} text-white font-black text-xl md:text-2xl px-5 py-3 rounded-2xl shadow-lg border-b-4 active:border-b-0 active:translate-y-1 transition-all cursor-pointer border-2 border-white/50`;
                card.textContent = syllable;
                card.draggable = true;

                card.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', syllable);
                    card.classList.add('opacity-50');
                });

                card.addEventListener('dragend', () => {
                    card.classList.remove('opacity-50');
                });

                card.addEventListener('click', () => {
                    document.querySelectorAll('.syllable-card').forEach(c => c.classList.remove('ring-4', 'ring-yellow-300', 'scale-105'));
                    if (selectedSyllable === syllable) {
                        selectedSyllable = null;
                    } else {
                        selectedSyllable = syllable;
                        card.classList.add('ring-4', 'ring-yellow-300', 'scale-105');
                        feedbackBanner.textContent = `Seleccionaste "${syllable}". Toca la casilla vacía en la palabra.`;
                    }
                });

                syllablesBank.appendChild(card);
            });
        }

        function clearSelection() {
            selectedSyllable = null;
            document.querySelectorAll('.syllable-card').forEach(c => c.classList.remove('ring-4', 'ring-yellow-300', 'scale-105'));
        }

        function verifyAnswer(syllable, dropTargetEl) {
            const expected = dropTargetEl.dataset.expected;

            if (syllable === expected) {
                hits++;
                updateScores();
                dropTargetEl.textContent = syllable;
                dropTargetEl.classList.remove('active-target');
                dropTargetEl.classList.add('correct');

                const praiseTextList = ["¡Muy bien!", "¡Excelente!", "¡Correcto!", "¡Muy bien hecho!"];
                const praiseSpeech = praiseTextList[Math.floor(Math.random() * praiseTextList.length)];
                
                feedbackBanner.textContent = praiseSpeech;
                speak(praiseSpeech, () => {
                    advanceGame();
                }, 0.65);

            } else {
                fails++;
                updateScores();
                
                feedbackBanner.textContent = "Inténtalo de nuevo.";
                speak("Inténtalo de nuevo", null, 0.65);

                dropTargetEl.classList.add('animate-bounce');
                setTimeout(() => dropTargetEl.classList.remove('animate-bounce'), 600);

                checkFailLimits();
            }
        }

        function advanceGame() {
            const currentSentence = LESSON_DATA[currentSentenceIdx];

            if (currentWordIdx < currentSentence.words.length - 1) {
                currentWordIdx++;
                renderSentence();
                renderSyllablesBank();
                dictateCurrentWord();
            } else {
                feedbackBanner.textContent = `¡Frase completada! Escucha la lectura completa.`;
                currentWordIdx++;
                renderSentence();

                setTimeout(() => {
                    speak(`Muy bien. Leemos: ${currentSentence.fullSentence}`, () => {
                        if (currentSentenceIdx < LESSON_DATA.length - 1) {
                            currentSentenceIdx++;
                            currentWordIdx = 0;
                            renderSentence();
                            renderSyllablesBank();
                            dictateCurrentWord();
                        } else {
                            speak("¡Felicidades! Has completado la lección de Tito y su moto.", () => {
                                showModal("¡Felicitaciones!", "¡Completaste toda la lección de Tito y su moto perfectamente!", () => {
                                    initGame();
                                });
                            }, 0.60);
                        }
                    }, 0.58);
                }, 400);
            }
        }

        function checkFailLimits() {
            if (fails === 12) {
                const msg = "Te quedan tres intentos";
                speak(msg, null, 0.65);
                showModal("¡Cuidado!", msg);
            } else if (fails === 13) {
                const msg = "Te quedan dos intentos";
                speak(msg, null, 0.65);
                showModal("¡Cuidado!", msg);
            } else if (fails === 14) {
                const msg = "Te queda un intento";
                speak(msg, null, 0.65);
                showModal("¡Atención!", msg);
            } else if (fails >= 15) {
                const msg = "Has alcanzado el límite de intentos. Vamos a reiniciar la lección.";
                speak(msg, () => {
                    showModal("Juego Reiniciado", "Has alcanzado 15 fallas. Volvamos a practicar desde el principio.", () => {
                        initGame();
                    });
                }, 0.65);
            }
        }

        function showModal(title, message, onClose = null) {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            modalOverlay.classList.remove('hidden');

            const handleClose = () => {
                modalOverlay.classList.add('hidden');
                modalBtn.removeEventListener('click', handleClose);
                if (onClose) onClose();
            };

            modalBtn.addEventListener('click', handleClose);
        }

        btnRepeatWord.addEventListener('click', () => {
            dictateCurrentWord();
        });

        window.onload = () => {
            initGame();
        };
    </script>
</body>
</html>
